name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the builder page is present
        run: |
          if [ ! -s app/src/main/assets/index.html ]; then
            echo "::error::app/src/main/assets/index.html is missing. Upload the builder page there (Add file > Upload files)."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        run: |
          gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk UnificationListBuilder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UnificationListBuilder-apk
          path: UnificationListBuilder.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Unification List Builder (latest build)
          body: |
            Build ${{ github.run_number }} of the app, from commit ${{ github.sha }}.
            On your phone, tap UnificationListBuilder.apk below to download it, then open it to install.
            Installing over an earlier build keeps your saved lists. See CHANGELOG.md for what changed.
          make_latest: true
          files: UnificationListBuilder.apk
