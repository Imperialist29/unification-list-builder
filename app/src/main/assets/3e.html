<header><div class="wrap3">
<h1>Horus Heresy Army List Builder — 3rd Edition</h1>
<div class="top3">
<label>Army name <input type="text" id="aname" placeholder="Unnamed army"></label>
<label>Points limit <input type="number" id="apts" min="500" step="250"></label>
<label>Allegiance <select id="aal"><option>Loyalist</option><option>Traitor</option></select></label>

</div>
<div class="bar3">
<button id="bnew">New</button><select id="lsel" aria-label="Saved lists"></select><button id="bsave" class="p">Save</button><button id="bdel" class="d">Delete</button><button id="bexp">Export text</button>
<span id="ptsum"></span>
</div>
<p class="src3 mu">Legiones Astartes army list imported from Wahapedia (Horus Heresy 3rd edition). Other army lists are on the way.</p>
</div></header>
<main>
<section id="armysec"><div class="ahead" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h2>Army</h2><span id="pcount"></span></div>
<div class="chips" id="unl"></div>
<div id="dets"></div>
<label>Add detachment <select id="adddet" data-a="adddet"></select></label>
<details class="sub" open style="margin-top:12px"><summary>Army checks</summary><div id="probs"></div></details>
</section>
<section id="side3"><h2>Unit</h2><div id="ued"></div>
<div id="expbox" hidden><h4>Export</h4><textarea id="exptxt" readonly></textarea><div class="bar3"><button id="bexpx">Close</button><span id="expmsg" class="mu"></span></div></div>
</section>

/* ---------- State ---------- */
let uid = 1;
const newDet = (k, extra) => Object.assign({id: "d" + (uid++), k, slots: {}, pa: {}, wild: null}, extra || {});
function blank() { return {v: 3, name: "", pts: 3000, al: "Loyalist", fac: "Dark Angels", dets: [newDet("crusade")]}; }
let S = blank();
let SEL = null; // {d: detId, s: slotIndex}
let PICK = null; // {d, s} slot being filled

/* ---------- Helpers ---------- */
const def = d => DEFS[d.k];
function detFac(d) {

}
function slotList(d) {

}
function unitBase(u) { return u.pts; }
function listItems(L, fac) { return (D.LISTS[L] || []).filter(x => !x.leg || (fac && x.leg.indexOf(fac) >= 0)); }
function optCap(o, inst, u) {

}
function choiceCost(o, name, fac) {

}

}

/* ---------- Unlocks ---------- */
function groupOf(d) {
  if (d.k === "allied") return d.id;

}
function tokens(gid) {

    const t = def(d).t;
    const inG = gid === "P" ? (t === "primary" || (t === "apex" && (d.link || "P") === "P")) : d.id === gid;
    if (!inG || def(d).noUnlock) return;
    const sl = slotList(d);
    for (const s in d.slots) {
      const u = U[d.slots[s].u]; if (!u) continue;
      const slot = sl[s]; if (!slot) continue;
      if (d.pa[s] === "Special Assignment") continue;
      if (slot.r === "High Command") hc++;
      else if (slot.r === "Command") {
        cmd += /Officer of the Line \(2\)/.test(u.ru) ? 2 : 1;

}

}

}

/* ---------- Validation ---------- */
function problems() {
  const out = [];

  if (pts > S.pts) out.push(`Army is ${pts - S.pts} points over the ${S.pts} point limit.`);
  const p = S.dets.filter(d => def(d).t === "primary");
  if (!Object.keys(p[0] ? p[0].slots : {}).length) out.push("The Primary Detachment needs at least one unit.");
  // Warlord + LoW cap
  let wl = 0; allInst().forEach(x => { if (x.u && (x.u.r === "Warlord" || x.u.r === "Lord of War")) wl += unitPts(x.inst, detFac(x.d)); });
  const cap = Math.ceil(S.pts * 0.25);
  if (wl > cap) out.push(`Warlord and Lord of War units total ${wl} points: the limit is 25% (${cap}).`);
  // Allied 50%
  let al = 0; S.dets.forEach(d => { if (d.k === "allied" || (d.link && S.dets.find(x => x.id === d.link && x.k === "allied"))) al += detPts(d); });
  if (al > Math.ceil(S.pts * 0.5)) out.push(`Allied units total ${al} points: the limit is 50% (${Math.ceil(S.pts * 0.5)}).`);
  S.dets.filter(d => d.k === "allied").forEach(d => { if (!d.fac) out.push("Choose a Faction for the Allied Detachment."); else if (d.fac === S.fac) out.push("An Allied Detachment must have a different Faction from the Primary Detachment."); });
  // Warlord detachment
  const wd = S.dets.filter(d => def(d).t === "warlord");
  if (wd.length > 1) out.push("Only one Warlord Detachment is allowed.");
  wd.forEach(d => {
    if (S.pts < 3000) out.push("A Warlord Detachment needs a points limit of 3,000 or more.");
    if (!Object.values(d.slots).some(i => U[i.u] && U[i.u].para)) out.push(`${def(d).n} must include a Paragon (Primarch).`);
  });
  if (S.dets.filter(d => d.k === "low").length > 1) out.push("Only one Lord of War Detachment is allowed.");
  // unlock counts
  const groups = ["P"].concat(S.dets.filter(d => d.k === "allied").map(d => d.id));
  groups.forEach(g => {
    const c = capacity(g);
    if (c.u.apex > c.apexMax) out.push(`Too many Apex Detachments: ${c.u.apex} taken, ${c.apexMax} unlocked by High Command${c.t.consul ? "/Consul-Delegatus" : ""} choices.`);
    else if (c.u.apex + c.u.aux > c.total) out.push(`Too many Apex/Auxiliary Detachments${g === "P" ? "" : " for the Allied Detachment"}: ${c.u.apex + c.u.aux} taken, ${c.total} unlocked by filled High Command and Command slots.`);
  });
  // legion detachment requirements
  S.dets.forEach(d => {
    const df = def(d);
    if (df.leg && detFac(d) !== df.leg) out.push(`${df.n} needs a ${df.leg} Detachment.`);
    if (df.al && S.al !== df.al) out.push(`${df.n} needs a ${df.al} army.`);
    if (df.req && !allInst().some(x => x.u && df.req.indexOf(x.u.n) >= 0)) out.push(`${df.n} needs ${df.req.join(" or ")} in the army.`);
    if (df.word && !d.word) out.push(`Choose Saturnine, Cataphractii or Tartaros for the ${df.n}.`);
    if (df.reqPrimary) { const p = S.dets.find(x => def(x).t === "primary"); if (!Object.values(p.slots).some(i => U[i.u] && df.reqPrimary.test(U[i.u].n))) out.push(`${df.n} needs a Master of Descent in the Primary Detachment.`); }
  });
  // detachments unlocked by a specific Command choice / once per army
  Object.keys(DEFS).forEach(k => {
    const df = DEFS[k], n = S.dets.filter(d => d.k === k).length; if (!n) return;
    if (df.once && n > 1) out.push(`${df.n} can only be taken once per army.`);
    if (df.unlockBy) {
      let have = 0; S.dets.forEach(d => { const sl = slotList(d); for (const s in d.slots) { const u = U[d.slots[s].u]; if (u && sl[s] && sl[s].r === "Command" && df.unlockBy.test(u.n)) have++; } });
      if (n > have) out.push(`Each ${df.n} must be unlocked by a matching unit in a Command slot (${n} taken, ${have} available).`);
    }
  });
  // unique / 0-1
  const cnt = {}; allInst().forEach(x => { if (x.u && (x.u.uq || x.u.l1)) cnt[x.u.n] = (cnt[x.u.n] || 0) + 1; });
  for (const n in cnt) if (cnt[n] > 1) out.push(`${n} can only be taken once (${cnt[n]} in the army).`);
  // legality of each unit in its slot
  S.dets.forEach(d => { const sl = slotList(d); for (const s in d.slots) { const u = U[d.slots[s].u]; const slot = Object.assign({idx: +s}, sl[s] || {}); if (!u || !sl[s]) out.push("A unit sits in a slot that no longer exists."); else if (!unitAllowed(u, d, slot)) out.push(`${u.n} is not allowed in that ${slot.r} slot (${def(d).n}).`); } });
  // prime advantages
  S.dets.forEach(d => {
    const n = {}; const sl = slotList(d);
    for (const s in d.pa) { const a = d.pa[s]; if (!a) continue; n[a] = (n[a] || 0) + 1;
      const inst = d.slots[s]; const u = inst && U[inst.u];

      if (a === "Special Assignment" && sl[s] && sl[s].r !== "Command") out.push("Special Assignment can only be used in a Command slot.");
      if (u && u.n.indexOf("Inductii") >= 0) out.push(`${u.n} cannot use a Prime Advantage (Inductii).`);
    }
    ["Master Sergeant", "Logistical Benefit"].forEach(a => { if ((n[a] || 0) > 1) out.push(`${a} can be used only once per Detachment (${def(d).n}).`); });
  });
  return out;

  let h = "";

  if (m.length) h += `<div class="tw"><table class="st wt"><thead><tr><th class="nm">Melee</th><th>IM</th><th>AM</th><th>SM</th><th>AP</th><th>D</th><th class="nm">Special rules</th><th class="nm">Traits</th></tr></thead><tbody>${m.map(o => `<tr><td class="nm">${esc(o.n)}</td>${o.x.s.map(v => `<td>${esc(v)}</td>`).join("")}<td class="nm">${esc(o.x.sr)}</td><td class="nm">${esc(o.x.tr)}</td></tr>`).join("")}</tbody></table></div>`;
  return h;
}
function optHtml(o, i, inst, u, fac) {
  const st = (inst.o && inst.o[i]) || {};
  const cap = optCap(o, inst, u);
  const items = [];
  o.ch.forEach(c => { if (c.L) listItems(c.L, fac).forEach(x => items.push({n: x.n, p: x.p, L: c.L})); else items.push({n: c.n, p: c.p}); });
  const lab = `<div class="ot">${esc(o.t)}</div>`;
  const cst = p => p ? `+${p}${o.pm && o.sc !== "one" ? "/model" : ""}` : "free";
  if (o.sc === "one" || o.sc === "all") {
    const cur = Object.keys(st).find(k => st[k]) || "";
    return `<div class="op">${lab}<select data-a="o1" data-i="${i}"><option value="">—</option>${items.map(x => `<option value="${esc(x.n)}"${x.n === cur ? " selected" : ""}>${esc(x.n)} (${cst(x.p)})</option>`).join("")}</select></div>`;
  }
  if (cap <= 0) return `<div class="op dis">${lab}<span class="mu">Needs more models.</span></div>`;
  const tot = Object.values(st).reduce((a, b) => a + (b || 0), 0);
  const dup = o.sc !== "multi" || o.dup;
  return `<div class="op">${lab}<div class="mu">Up to ${cap}${tot ? ` · ${tot} chosen` : ""}</div><div class="oq">${items.map(x => {
    const q = st[x.n] || 0;
    return dup ? `<label class="qn"><input type="number" min="0" max="${cap}" value="${q}" data-a="oq" data-i="${i}" data-n="${esc(x.n)}"> ${esc(x.n)} <span class="pc">${cst(x.p)}</span></label>`
               : `<label class="qn"><input type="checkbox" ${q ? "checked" : ""} data-a="oc" data-i="${i}" data-n="${esc(x.n)}"> ${esc(x.n)} <span class="pc">${cst(x.p)}</span></label>`;
  }).join("")}</div></div>`;
}
function renderUnit() {
  const box = $("#ued");
  if (!SEL) { box.innerHTML = `<p class="mu">Choose a unit in the army to edit it and see its datasheet.</p>`; return; }
  const d = S.dets.find(x => x.id === SEL.d); const inst = d && d.slots[SEL.s]; const u = inst && U[inst.u];
  if (!u) { SEL = null; box.innerHTML = `<p class="mu">Choose a unit in the army to edit it and see its datasheet.</p>`; return; }
  const fac = detFac(d);
  let h = `<div class="uh"><h3>${esc(u.n)}</h3><b class="upt">${unitPts(inst, fac)} pts</b></div>`;
  h += `<div class="mu">${esc(u.r)} · ${esc(def(d).n)}${u.fac ? " · " + esc(u.fac) : ""}${u.al ? " · " + esc(u.al) : ""}${u.uq ? " · Unique" : ""}${u.l1 ? " · 0-1" : ""}</div>`;
  if (u.max > u.min) h += `<label class="sz">Models (${u.min}–${u.max}, +${u.per} each) <input type="number" min="${u.min}" max="${u.max}" value="${inst.sz || u.min}" data-a="sz"></label>`;
  if (u.comp) h += `<p class="cmp mu">${esc(u.comp)}</p>`;
  if ((u.os || []).length) h += `<details class="sub" open><summary>Wargear options</summary>${u.os.map((o, i) => optHtml(o, i, inst, u, fac)).join("")}</details>`;
  h += `<h4>Profiles</h4>` + profTable(u);
  h += `<dl class="dl"><dt>Type</dt><dd>${esc(u.ty)}</dd><dt>Wargear</dt><dd>${esc(u.g)}</dd><dt>Special rules</dt><dd>${esc(u.ru)}</dd><dt>Traits</dt><dd>${esc(u.tr)}</dd></dl>`;
  const ws = weaponsOf(u, inst);
  if (ws.length) h += `<h4>Weapons</h4>` + weaponTable(ws);
  box.innerHTML = h;
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  const a = b.dataset.a, d = b.dataset.d && S.dets.find(x => x.id === b.dataset.d), s = b.dataset.s != null ? +b.dataset.s : null;
  if (a === "pick") { PICK = PICK && PICK.d === d.id && PICK.s === s ? null : {d: d.id, s}; renderArmy(); }
  else if (a === "put") { d.slots[s] = {u: b.dataset.u, sz: U[b.dataset.u].min, o: {}}; PICK = null; SEL = {d: d.id, s}; renderArmy(); if (innerWidth < 900) $("#ued").scrollIntoView({behavior: "smooth"}); }
  else if (a === "sel") { SEL = {d: d.id, s}; renderArmy(); if (innerWidth < 900) $("#ued").scrollIntoView({behavior: "smooth"}); }
  else if (a === "rm") { delete d.slots[s]; delete d.pa[s]; if (SEL && SEL.d === d.id && SEL.s === s) SEL = null; renderArmy(); }
  else if (a === "rmdet") { S.dets = S.dets.filter(x => x !== d); S.dets.forEach(x => { if (x.link === d.id) x.link = null; }); if (SEL && SEL.d === d.id) SEL = null; renderArmy(); }
});
document.addEventListener("change", e => {
  const t = e.target, a = t.dataset.a; if (!a) return;
  const d = t.dataset.d && S.dets.find(x => x.id === t.dataset.d);
  if (a === "pa") { d.pa[t.dataset.s] = t.value; if (t.value !== "Logistical Benefit" && !Object.values(d.pa).includes("Logistical Benefit")) { if (d.wild) { const n = slotList(d).length - 1; delete d.slots[n]; } d.wild = null; } renderArmy(); }
  else if (a === "wild") { d.wild = t.value || null; renderArmy(); }
  else if (a === "dfac") { d.fac = t.value || null; for (const s in d.slots) { const u = U[d.slots[s].u]; if (u && u.fac && u.fac !== d.fac) delete d.slots[s]; } renderArmy(); }
  else if (a === "link") { d.link = t.value || null; renderArmy(); }
  else if (a === "word") { d.word = t.value || null; for (const s in d.slots) { const u = U[d.slots[s].u]; if (u && (u.r === "Retinue" || u.r === "Heavy Assault") && (!d.word || u.n.indexOf(d.word) < 0)) delete d.slots[s]; } renderArmy(); }
  else if (["sz", "o1", "oq", "oc"].includes(a)) {
    const dd = S.dets.find(x => x.id === SEL.d), inst = dd.slots[SEL.s], u = U[inst.u];
    inst.o = inst.o || {};
    if (a === "sz") { inst.sz = Math.max(u.min, Math.min(u.max, parseInt(t.value) || u.min)); }
    else {
      const i = t.dataset.i; const o = u.os[i]; const st = inst.o[i] = inst.o[i] || {};
      if (a === "o1") { for (const k in st) delete st[k]; if (t.value) st[t.value] = 1; }
      else {
        const cap = optCap(o, inst, u);
        const v = a === "oc" ? (t.checked ? 1 : 0) : Math.max(0, parseInt(t.value) || 0);
        st[t.dataset.n] = v;
        let tot = Object.values(st).reduce((x, y) => x + (y || 0), 0);
        if (tot > cap) st[t.dataset.n] = Math.max(0, v - (tot - cap));
      }
    }
    // clamp counted options when the unit shrinks
    (u.os || []).forEach((o, i) => { const st = inst.o[i]; if (!st || o.sc === "one" || o.sc === "all") return; const cap = optCap(o, inst, u); let tot = 0; for (const k in st) { const q = Math.min(st[k] || 0, Math.max(0, cap - tot)); st[k] = q; tot += q; } });
    renderArmy();
  }
  else if (a === "adddet") {
    if (!t.value) return;
    const [k, g] = t.value.split("|");
    const nd = newDet(k, g ? {link: g} : {});
    if (k === "allied") nd.fac = null;
    S.dets.push(nd); t.value = ""; renderArmy();
  }
});
function bindTop() {
  $("#aname").value = S.name; $("#apts").value = S.pts; $("#aal").value = S.al; $("#afac").value = S.fac;
  $("#aname").oninput = () => { S.name = $("#aname").value; save(); };
  $("#apts").onchange = () => { S.pts = Math.max(500, parseInt($("#apts").value) || 3000); renderArmy(); };
  $("#aal").onchange = () => { S.al = $("#aal").value; renderArmy(); };
  $("#afac").onchange = () => { S.fac = $("#afac").value; renderArmy(); };
}

/* ---------- Save / load / export ---------- */
function save() { LS.set("hhlb3_cur", JSON.stringify(S)); }
function load(o) {
  if (!o || !o.dets) return;
  S = o; uid = 1 + S.dets.reduce((m, d) => Math.max(m, parseInt(String(d.id).slice(1)) || 0), 0);
  S.dets.forEach(d => { if (!DEFS[d.k]) d.k = "crusade"; d.slots = d.slots || {}; d.pa = d.pa || {}; for (const s in d.slots) if (!U[d.slots[s].u]) delete d.slots[s]; });
  SEL = null; PICK = null; bindTop(); renderArmy();
}
function lists() { try { return JSON.parse(LS.get("hhlb3_lists") || "{}"); } catch (e) { return {}; } }
function renderLists() { const L = lists(); $("#lsel").innerHTML = `<option value="">Saved lists…</option>` + Object.keys(L).sort().map(n => `<option>${esc(n)}</option>`).join(""); }
function exportText() {
  const L = [];

  L.push("Horus Heresy 3rd Edition (Age of Darkness)");
  S.dets.forEach(d => {
    L.push(""); L.push(`== ${def(d).n}${detFac(d) && detFac(d) !== S.fac ? " (" + detFac(d) + ")" : ""} [${detPts(d)}] ==`);
    const sl = slotList(d);
    Object.keys(d.slots).map(Number).sort((a, b) => a - b).forEach(s => {
      const inst = d.slots[s], u = U[inst.u]; if (!u) return;
      let line = `${sl[s] ? sl[s].r : "?"}${sl[s] && sl[s].prime ? " (Prime" + (d.pa[s] ? ": " + d.pa[s] : "") + ")" : ""}: ${u.n}${(inst.sz || u.min) > 1 ? " x" + (inst.sz || u.min) : ""} [${unitPts(inst, detFac(d))}]`;
      L.push(line);
      const ch = []; (u.os || []).forEach((o, i) => { const st = inst.o && inst.o[i]; if (st) for (const n in st) if (st[n]) ch.push((o.sc === "cnt" || o.sc === "multi") && st[n] > 1 ? `${st[n]}× ${n}` : n); });
      if (ch.length) L.push("   " + ch.join(", "));
    });
  });
  const pr = problems(); if (pr.length) { L.push(""); L.push("Issues:"); pr.forEach(p => L.push(" - " + p)); }
  return L.join("\n");
}
function initTop() {
  $("#afac").innerHTML = LEGIONS.map(l => `<option>${esc(l)}</option>`).join("");
  $("#adddet").onchange = e => {}; // handled by delegated change (data-a)
  $("#bnew").onclick = () => { if (confirm("Start a new army? Unsaved changes to this one are lost.")) { S = blank(); SEL = null; bindTop(); renderArmy(); } };
  $("#bsave").onclick = () => { const n = (S.name || "").trim() || prompt("Name this army:"); if (!n) return; S.name = n; const L = lists(); L[n] = S; LS.set("hhlb3_lists", JSON.stringify(L)); renderLists(); $("#lsel").value = n; bindTop(); };
  $("#lsel").onchange = () => { const L = lists(); const n = $("#lsel").value; if (n && L[n]) load(JSON.parse(JSON.stringify(L[n]))); };
  $("#bdel").onclick = () => { const n = $("#lsel").value; if (!n) return; if (!confirm(`Delete "${n}"?`)) return; const L = lists(); delete L[n]; LS.set("hhlb3_lists", JSON.stringify(L)); renderLists(); };
  $("#bexp").onclick = () => { const t = exportText(); $("#exptxt").value = t; $("#expbox").hidden = false; try { navigator.clipboard.writeText(t); $("#expmsg").textContent = "Copied to the clipboard."; } catch (e) { $("#expmsg").textContent = ""; } };
  $("#bexpx").onclick = () => { $("#expbox").hidden = true; };
}
initTop(); renderLists();
try { const c = JSON.parse(LS.get("hhlb3_cur") || "null"); if (c && c.v === 3) load(c); else { bindTop(); renderArmy(); } } catch (e) { bindTop(); renderArmy(); }
</script>
